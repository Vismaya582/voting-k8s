apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: voting-app
  namespace: argocd
spec:
  project: voting-app
  source:
    repoURL: https://github.com/Vismaya582/voting-app
    targetRevision: HEAD
    path: 
    helm:
      valueFiles:
      - values.yaml
  destination:
    server: 
    namespace: 
  syncPolicy:
    automated:
      prune: true
      selfHeal: true