apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: voting-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Vismaya582/voting-k8s
    targetRevision: HEAD
    path: charts/voting-app
    helm:
      valueFiles:
      - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: vote
  syncPolicy:
    automated:
      prune: true
      selfHeal: true